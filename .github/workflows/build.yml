name: Build Installer

# 手动触发：仓库页面 Actions → Build Installer → Run workflow
# 也可以推 v* 标签自动构建
on:
  workflow_dispatch:
    inputs:
      targets:
        description: '要构建的平台，JSON 数组（windows-latest / macos-latest / ubuntu-latest）'
        required: false
        default: '["windows-latest","macos-latest"]'
      arch:
        description: '目标架构（仅对 Windows / Linux 生效；macOS 固定出 arm64 + x64 两份）'
        type: choice
        options:
          - x64
          - arm64
        default: x64
      android:
        description: '同时构建 Android debug APK'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 package.json 的 package 脚本保持一致，避免 publish 阶段去找 S3 凭据
  UPDATE_CHANNEL: alpha
  # 没有 mac 签名证书时不要尝试自动发现
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  ARCH: ${{ github.event.inputs.arch || 'x64' }}

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event.inputs.targets || '["windows-latest","macos-latest"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 不要在这里写 version：package.json 的 packageManager 已指定
      # pnpm@10.33.0+sha512...，两处同时指定会让 action 报
      # "Multiple versions of pnpm specified"，直接失败。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build main / preload / renderer
        run: pnpm run build

      # 开源仓库里没有官方签名脚本 custom_win_sign.js，electron-builder 会因找不到
      # 该模块直接失败。这里在打包前把 win.signtoolOptions 整段删掉，改用无签名构建。
      # 注意：1.24 的 electron-builder.yml 里这段仍是 signtoolOptions: → sha256，
      # 上游如果改了字段名，sed 会静默不生效（不报错），打包阶段才会炸。
      - name: Drop Windows signing config
        if: runner.os == 'Windows'
        shell: bash
        run: sed -i '/signtoolOptions:/,/sha256/d' electron-builder.yml

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder build --win --${{ env.ARCH }} --publish never

      # macOS 不传 --arch：electron-builder.yml 的 mac.target.arch 已是 [arm64, x64]，
      # 一次产出两个架构的 dmg/zip，Intel 和 Apple Silicon 都能装。
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: pnpm exec electron-builder build --mac --publish never

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder build --linux --${{ env.ARCH }} --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-${{ matrix.os }}
          path: |
            release/build/*.exe
            release/build/*.dmg
            release/build/*.zip
            release/build/*.AppImage
            release/build/*.deb
          if-no-files-found: error
          retention-days: 14

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    if: github.event_name == 'push' || github.event.inputs.android == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # Capacitor 7 + AGP 8.x 要 JDK 21；runner 默认是 17，必须显式指定
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest 镜像里预装的 cmdline-tools 是 12.0，setup-android@v3 会直接
      # 报 "Wrong version in preinstalled sdkmanager" 然后失败（Pkg.Revision=12.0）。
      # 先删掉，让 action 自己装一份干净的。
      - name: Drop preinstalled Android cmdline-tools
        run: sudo rm -rf /usr/local/lib/android/sdk/cmdline-tools

      # 这个 action 的 packages 默认值是 legacy 的 `tools`，而新版 sdkmanager（16.0）
      # 的仓库里已经没有 `tools` 包了，会报 "Failed to find package 'tools'" 并以 1 退出。
      # 显式改成 platform-tools：镜像里本来就装好了，等于直接跳过。
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须带 mobile_app + android 两个环境变量，否则 feature-flags / platform
      # 会按桌面处理，打出来的包没有手机端的界面
      - name: Build renderer for Android
        run: pnpm exec cross-env CHATBOX_BUILD_TARGET=mobile_app CHATBOX_BUILD_PLATFORM=android CHATBOX_ELECTRON_VITE_TARGET=renderer electron-vite build

      - name: Verify web assets
        run: test -f release/app/dist/renderer/index.html

      # 仓库里没有 android/ 原生工程，现场生成
      - name: Add Android platform
        run: pnpm exec cap add android

      - name: Capacitor sync
        run: pnpm exec cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatbox-android
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
